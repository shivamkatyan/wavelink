# WDR — GitHub Pages site.
#
# Builds the static site with scripts/site/build.sh (identical output locally
# via `just site`) and deploys it with the official Pages actions from the
# built artifact (no build committed to the repo).
#
# SETUP (one-time, in repo Settings):
#   Settings -> Pages -> Source: "GitHub Actions"
# While Source is "Deploy from a branch", this workflow still builds fine but
# the deploy job will not publish — flip the toggle to GitHub Actions.
name: pages

"on":
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (for the site build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No cache: pip here — the repo has no requirements.txt/pyproject.toml,
          # and scripts/site/build.sh installs its only dep (markdown, pure-Python)
          # itself; pip cache would make setup-python fail step 2 (no dep file).

      - name: Build static site
        run: bash scripts/site/build.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
