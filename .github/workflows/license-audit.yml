name: license-audit

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

# ENABLED 2026-09-13: B0 Cargo.lock + deny.toml landed; `cargo deny check licenses`
# and `cargo audit` verified green locally (deny: "licenses ok" — only
# unused-allowance warnings for MPL-2.0/OpenSSL; audit: 0 findings, 273 crates).
# Job `if:` uses the explicit enabling predicate below (not `true`) so the gate
# runs on PRs / dispatch / tag pushes rather than every branch push.

jobs:
  license-audit:
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.ref, 'refs/tags/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (pinned stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo-home + binary registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/cargo-deny
            ~/.cache/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}

      # Cargo tools are installed per-run so compiler-sys crate versions match the pin.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --root "$RUNNER_TEMP/ctools"
        env:
          CARGO_NET_RETRY: 5

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --root "$RUNNER_TEMP/ctools"
        env:
          CARGO_NET_RETRY: 5

      - name: Install cargo-cyclonedx
        run: >
          cargo install --locked cargo-cyclonedx --root "$RUNNER_TEMP/ctools"
          || echo "::warning::cargo-cyclonedx install failed (best-effort SBOM step)"
        env:
          CARGO_NET_RETRY: 5

      - name: License + advisory gate (cargo-deny)
        run: |
          "$RUNNER_TEMP/ctools/bin/cargo-deny" check licenses

      - name: Advisory scan (cargo-audit)
        run: |
          "$RUNNER_TEMP/ctools/bin/cargo-audit" audit

      - name: Semantic CI gate — lockfile bakes a conflict into generated validity (no-op placeholders)
        if: false
        run: echo "placeholder — see SBOM_POLICY.md for gate semantics"

      - name: Generate SBOM (cargo-cyclonedx / syft)
        run: |
          if [ -x "$RUNNER_TEMP/ctools/bin/cargo-cyclonedx" ]; then
            "$RUNNER_TEMP/ctools/bin/cargo-cyclonedx" cyclonedx --output-dir "$RUNNER_TEMP/sbom" || \
              echo "::warning::cyclonedx generation failed for this revision"
          else
            echo "::notice::cargo-cyclonedx unavailable; SBOM step skipped"
          fi

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: ignore
