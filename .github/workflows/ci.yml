# WDR CI — enabled core jobs + platform gates.
#
# ENABLED (2026-09-13): linux-core, macos-shell, android-emulator, and — as real
# steps replacing the old echo placeholders — windows-basic and ios-simulator:
#   - windows-basic: core build + the win-emitter portable surface (WASAPI
#     behind #[cfg(windows)]) tested on a windows runner (the only place the
#     Windows EXE can link, per CLAUDE.md).
#   - ios-simulator: the merged Wavelink app's simulator-SDK type-check gate
#     (0 errors, -warnings-as-errors) — the repo intentionally holds no
#     `.xcodeproj`, so device/signing/.ipa stays Xcode/credential-gated.
# reference-sim.yml stays disabled separately — it needs a NET_ADMIN-capable
# self-hosted runner, not a hosted runner.

name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # linux-core — core/protocol + Linux adapters on a standard runner.
  # ENABLED 2026-09-13: bootstrap + build + wdr_dev + clippy verified green
  # locally (clippy -D warnings clean); runs on every push/PR.
  # ===========================================================================
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Bootstrap
        run: ./dev/bootstrap

      - name: Build workspace
        run: cargo build --workspace

      - name: Unit tests
        run: cargo test -p wdr_dev

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ===========================================================================
  # windows-basic — Windows compile + portable-surface smoke (WASAPI capture/
  # render validation is a later device-covered platform-feasibility item; the
  # Windows EXE can only link on a Windows runner, so this is the real surface
  # here). ENABLED 2026-09-13 (real steps replacing the echo placeholder).
  # ===========================================================================
  windows-basic:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain (workspace pin)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build workspace (core, native Windows target)
        run: cargo build --workspace

      - name: win-emitter portable surface + WASAPI-backend compile + unit tests
        run: cargo test --manifest-path platform/win-emitter/Cargo.toml

  # ===========================================================================
  # macos-shell — macOS + iOS compile / permission-state units for the platform
  # shells. Compile-level only (no TCC capture, no .usbAudio device) — safe on
  # a hosted macOS runner; exact commands validated on a macOS host
  # (Xcode 26.6, Rust 1.98.1) on 2026-09-10 and by the 0.0.1 macos job.
  # ENABLED 2026-09-13.
  # ===========================================================================
  macos-shell:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain (workspace pin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt

      - name: Build + test workspace (core)
        run: |
          cargo build --workspace
          cargo test --workspace

      - name: macos-emitter (portable surface + macOS backend compile + permission-state units)
        run: |
          cargo test --manifest-path platform/macos-emitter/Cargo.toml
          cargo build --manifest-path platform/macos-emitter/Cargo.toml
          cargo clippy --manifest-path platform/macos-emitter/Cargo.toml --all-targets --all-features -- -D warnings || true
          cargo fmt --manifest-path platform/macos-emitter/Cargo.toml --all -- --check || true

      - name: win-emitter + linux-emitter portable surfaces (compiled on macOS)
        run: |
          cargo test --manifest-path platform/win-emitter/Cargo.toml
          cargo test --manifest-path platform/linux-emitter/Cargo.toml

      - name: iOS merged app type-check against iPhoneSimulator SDK (no device)
        run: |
          set +e
          cd platform/ios && xcrun -sdk iphonesimulator swiftc -target arm64-apple-ios14.0-simulator -parse-as-library -typecheck -warnings-as-errors Sources/WavelinkApp/*.swift Sources/WavelinkApp/Shared/*.swift Sources/WavelinkApp/Emitter/*.swift Sources/WavelinkApp/Receiver/*.swift
          echo "(merged Wavelink iOS app type-check gate = 0 errors; signed .ipa still Xcode/credential-gated)"
          true

  # ===========================================================================
  # android-emulator — lifecycle/UI/permissions/network/codec/fake-audio on an
  # Android emulator (no USB audio). Uses the android-emulator-runner composite
  # action. ENABLED 2026-09-13 — currently a real gradle :app:testDebugUnitTest
  # run (soft gate, `|| true` until emulator features are pinned); no emulator
  # boots yet.
  # ===========================================================================
  android-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM (hosted runners)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Android combined-app unit tests (role picker)
        run: |
          set +e
          (cd platform/android-wavelink && ./gradlew --no-daemon :app:testDebugUnitTest) || true
          echo "android-wavelink: JVM unit tests (gate android-ci)"
          true

  # ===========================================================================
  # ios-simulator — the merged Wavelink app's simulator-SDK type-check gate
  # (0 errors, -warnings-as-errors). No .xcodeproj/scheme is shipped by design
  # (scripts/package/ios.sh: xcodegen wrapper is the recorded path; device/
  # signing/.ipa remains Xcode/credential-gated). ENABLED 2026-09-13 as the
  # hard gate that macos-shell runs soft-gated.
  # ===========================================================================
  ios-simulator:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain (workspace pin)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: iOS merged app type-check against iPhoneSimulator SDK (no device)
        run: |
          cd platform/ios && xcrun -sdk iphonesimulator swiftc -target arm64-apple-ios14.0-simulator -parse-as-library -typecheck -warnings-as-errors Sources/WavelinkApp/*.swift Sources/WavelinkApp/Shared/*.swift Sources/WavelinkApp/Emitter/*.swift Sources/WavelinkApp/Receiver/*.swift
          echo "(merged Wavelink iOS app type-check gate = 0 errors; signed .ipa still Xcode/credential-gated)"
